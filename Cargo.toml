[package]
name = "xi-client"
version = "0.2.1"
edition = "2024"
description = "SDK for talking to xi-core. No GUI deps."
license = "Apache-2.0"
repository = "https://github.com/loc-oss/xi-client"
readme = "README.md"
keywords = ["editor", "text-editor", "sdk", "xi", "json-rpc"]
categories = ["development-tools", "text-editors"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
xi-rpc = { git = "https://github.com/loc-oss/xi-rpc", branch = "main" }

[dev-dependencies]
tempfile = "3"
